name: Daily Repository Update - 21f3002303@ds.study.iitm.ac.in

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write        # ← THIS fixes the 403 error

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "21f3002303@ds.study.iitm.ac.in"

      - name: Update daily log - 21f3002303@ds.study.iitm.ac.in
        run: |
          mkdir -p logs
          echo "Daily update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> logs/daily-log.txt

      - name: Commit and push changes
        run: |
          git add logs/daily-log.txt
          git commit -m "chore: daily automated update $(date -u '+%Y-%m-%d')"
          git push

